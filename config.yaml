# config.yaml - my main settings file. i keep everything here so i dont hardcode stuff anywhere
version: "1.0"
# basic index info
index:
  ticker: "^NSEI"
  name: "NIFTY50_SYNTHETIC"
  synthetic_name: "NIFTY50_SYNTHETIC"
# db settings, actual passwords are in .env file not here
database:
  host: ${DB_HOST}
  port: 5432
  name: ${DB_NAME}
  user: ${DB_USER}
  password: ${DB_PASSWORD}
  tables:
    raw_ticks: "nifty_ticks" # raw 1min data
    min_5: "min_5" # 5min resampled
    index_min_5: "nifty50_index_5m" # 5min index candles
# file paths and market timing stuff
data:
  csv_folder: ${DATA_FOLDER}
  cache_path: "output/raw_5min_cache.parquet" # keeping it inside output/ so everything is in one place
  market_hours:
    open: "09:15"
    close: "15:30"
  timezone: "Asia/Kolkata"
# all 50 nifty stocks
tickers:
  - ADANIENT
  - ADANIPORTS
  - APOLLOHOSP
  - ASIANPAINT
  - AXISBANK
  - BAJAJ-AUTO
  - BAJAJFINSV
  - BAJFINANCE
  - BHARTIARTL
  - BPCL
  - BRITANNIA
  - CIPLA
  - COALINDIA
  - DIVISLAB
  - DRREDDY
  - EICHERMOT
  - GRASIM
  - HCLTECH
  - HDFCBANK
  - HDFCLIFE
  - HEROMOTOCO
  - HINDALCO
  - HINDUNILVR
  - ICICIBANK
  - INDUSINDBK
  - INFY
  - ITC
  - JSWSTEEL
  - KOTAKBANK
  - LT
  - LTIM
  - MARUTI
  - MM
  - NESTLEIND
  - NTPC
  - ONGC
  - POWERGRID
  - RELIANCE
  - SBILIFE
  - SBIN
  - SUNPHARMA
  - TATACONSUM
  - TATAMOTORS
  - TATASTEEL
  - TCS
  - TECHM
  - TITAN
  - ULTRACEMCO
  - UPL
  - WIPRO
# some stocks have different names in data source so mapping them here
ticker_map:
  MM: "M&M"
# analysis settings
analysis:
  crash_threshold: -0.10 # below -10% = crash day
  monte_carlo_simulations: 1000
  risk_free_rate_annual: 0.065 # indian tbill rate roughly
  trading_days_per_year: 252
# buy/sell pressure settings
pressure:
  rolling_window: 20 # 20 day window
  accumulation_threshold: 0.6 # above this = buyers winning
  distribution_threshold: 0.4 # below this = sellers winning
# backfill settings
backfill:
  provider: "upstox"
  chunk_days: 20
  default_lookback_days: 365
  sleep_between_chunks: 1
  upstox:
    instrument_file: null
    request_timeout_seconds: 30
    allow_symbol_fallback: false
    instrument_map:
      ADANIENT: "NSE_EQ|ADANIENT"
      ADANIPORTS: "NSE_EQ|ADANIPORTS"
      APOLLOHOSP: "NSE_EQ|APOLLOHOSP"
      ASIANPAINT: "NSE_EQ|ASIANPAINT"
      AXISBANK: "NSE_EQ|AXISBANK"
      BAJAJ-AUTO: "NSE_EQ|BAJAJ-AUTO"
      BAJAJFINSV: "NSE_EQ|BAJAJFINSV"
      BAJFINANCE: "NSE_EQ|BAJFINANCE"
      BHARTIARTL: "NSE_EQ|BHARTIARTL"
      BPCL: "NSE_EQ|BPCL"
      BRITANNIA: "NSE_EQ|BRITANNIA"
      CIPLA: "NSE_EQ|CIPLA"
      COALINDIA: "NSE_EQ|COALINDIA"
      DIVISLAB: "NSE_EQ|DIVISLAB"
      DRREDDY: "NSE_EQ|DRREDDY"
      EICHERMOT: "NSE_EQ|EICHERMOT"
      GRASIM: "NSE_EQ|GRASIM"
      HCLTECH: "NSE_EQ|HCLTECH"
      HDFCBANK: "NSE_EQ|HDFCBANK"
      HDFCLIFE: "NSE_EQ|HDFCLIFE"
      HEROMOTOCO: "NSE_EQ|HEROMOTOCO"
      HINDALCO: "NSE_EQ|HINDALCO"
      HINDUNILVR: "NSE_EQ|HINDUNILVR"
      ICICIBANK: "NSE_EQ|ICICIBANK"
      INDUSINDBK: "NSE_EQ|INDUSINDBK"
