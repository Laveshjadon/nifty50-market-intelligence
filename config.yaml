    ULTRACEMCO: 0.0124
    UPL: 0.0200
    WIPRO: 0.0052

# modeling dataset settings
feature_engineering:
  volume_window: 20
  min_rows_per_ticker: 500
  strict_common_timestamps: true
  clip_quantiles:
    lower: 0.01
    upper: 0.99
  output_dataset_path: "output/modeling/nifty50_wide_dataset.parquet"
  output_summary_json: "output/modeling/nifty50_wide_dataset_summary.json"

# feature layout shared by the forecasting model
model_features:
  base_cols:
    - log_ret
    - log_ret_o
    - hl_ratio
    - co_ratio
    - vol_ratio
    - upper_wick_ratio
    - lower_wick_ratio
    - body_ratio
    - buying_pressure
  lags: 1

# keep this block only for backward compatibility with any older scripts
xgboost:
  features:
    base_cols:
      - log_ret
      - log_ret_o
      - hl_ratio
      - co_ratio
      - vol_ratio
      - upper_wick_ratio
      - lower_wick_ratio
      - body_ratio
      - buying_pressure
    lags: 1

lstm:
  sequence_length: 48
  training:
    hidden_size: 128
    num_layers: 2
    dropout: 0.3
    batch_size: 32
    epochs: 30
    learning_rate: 0.0005
    weight_decay: 0.0001
    gradient_clip_norm: 1.0
    early_stopping_patience: 5
    lr_scheduler: true

# train/eval/inference settings
modeling:
  dev_mode: false
  dev_rows: 15000
  target_column: "basket_target_ret"
  validation_target_column: "index_target_ret"
  train_ratio: 0.8
  force_rebuild_dataset: false
  output_model_path: "output/models/nifty50_lstm_state.pt"
  output_model_metadata_path: "output/models/nifty50_lstm_metadata.json"
  output_metrics_path: "output/models/nifty50_lstm_metrics.json"
  output_comparison_report_path: "output/models/comparison_report.json"
  output_latest_prediction_path: "output/models/nifty50_lstm_latest_prediction.json"

# sector map + signal windows
signals:
  recent_bars: 1600
  momentum_windows:
    short: 3
    medium: 12
    long: 78
  volume_spike_window: 20
  high_low_window: 252
  top_n: 5
  output_path: "output/signals/latest_signals.json"
  sector_map:
