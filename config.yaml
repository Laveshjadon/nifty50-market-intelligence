# news ingestion + summarization settings
news:
  data_dir: "news_data"
  preferred_files:
    - "news_gap_2025_06_12_to_2026_04_15.csv"
    - "filtered_market_news_updated.csv"
  lookback_days: 7
  output_processed_csv: "output/news/latest_news_scored.csv"
  output_summary_json: "output/news/latest_news_summary.json"
  high_risk_negative_threshold: -0.35
  top_negative_count: 8

# final markdown report settings
report:
  output_path: "output/reports/nifty50_7day_report.md"
