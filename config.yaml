      TITAN: "NSE_EQ|TITAN"
      ULTRACEMCO: "NSE_EQ|ULTRACEMCO"
      UPL: "NSE_EQ|UPL"
      WIPRO: "NSE_EQ|WIPRO"
# output stuff
output:
  directory: "output"
  dpi: 150
# synthetic index settings

synthetic_index:
  base_value: 1000.0
  min_constituent_coverage_ratio: 1.0 # 1.0 means all 50 stocks must be present, lower it to like 0.9 if some stocks are missing
  volume_method: "sum"
  weights:
    ADANIENT: 0.0045
    ADANIPORTS: 0.0095
    APOLLOHOSP: 0.0075
    ASIANPAINT: 0.0096
    AXISBANK: 0.0326
